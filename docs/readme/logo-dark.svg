<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 72" fill="none">
  <defs>
    <linearGradient id="sheen" x1="10" y1="10" x2="44" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4CDB8"/>
      <stop offset="0.55" stop-color="#C9E6D6"/>
      <stop offset="1" stop-color="#D6D9F0"/>
    </linearGradient>
    <linearGradient id="glass" x1="22" y1="6" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3C8F71"/>
      <stop offset="1" stop-color="#1F5A47"/>
    </linearGradient>
    <clipPath id="today"><rect x="20" y="6" width="34" height="48" rx="17"/></clipPath>
  </defs>
  <!-- Kept logo for dark backgrounds: same mark as public/brand/logo.svg, light wordmark -->
  <rect x="6" y="12" width="34" height="48" rx="17" stroke="#C9E6D6" stroke-opacity="0.55" stroke-width="3.5"/>
  <rect x="20" y="6" width="34" height="48" rx="17" fill="url(#glass)"/>
  <rect x="6" y="12" width="34" height="48" rx="17" fill="url(#sheen)" clip-path="url(#today)"/>
  <text x="68" y="49" font-family="Onest, Manrope, system-ui, sans-serif" font-size="44" font-weight="700" letter-spacing="-1.5" fill="#EEF2EE">kept</text>
</svg>
